<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace">
  <title id="title">Mohammad Hommam Ijaz — Industrial Biotechnology Student</title>
  <desc id="desc">Terminal-style profile banner. A stylized E. coli cell slowly expresses green fluorescent protein. A system panel lists name, study, focus areas, tools, lab work and the VNIAS project.</desc>

  <style>
    .t{fill:#E6EDF3}.m{fill:#9AA7B4}.d{fill:#6B7885}.c{fill:#7FC4DC}.g{fill:#6FD9A0}
    .frame{stroke:#1E2935}.ln{stroke:#FFFFFF;stroke-opacity:.08}
    .mem{stroke:#A3B8CA;stroke-opacity:.6}.imem{stroke:#7F95A8;stroke-opacity:.38}
    .dna{stroke:#93A9BC;stroke-opacity:.42}.rung{stroke:#93A9BC;stroke-opacity:.22}
    .rib{fill:#AFC1D1;fill-opacity:.4}.flag{stroke:#8FA3B5;stroke-opacity:.3}
    .ring{stroke:#FFFFFF;stroke-opacity:.07}.plas{stroke:#A3B8CA;stroke-opacity:.5}
    .spec{stroke:#FFFFFF;stroke-opacity:.14}
    .gstroke{stroke:#6FD9A0}.gfill{fill:#7BE3A8}
    .pill{fill:#7FC4DC;fill-opacity:.07;stroke:#7FC4DC;stroke-opacity:.28}
    .w1{fill:#D4776E}.w2{fill:#D8B366}.w3{fill:#6FBF8A}
    .lbl{font-size:11px;letter-spacing:.14em}

    /* GFP expression cycle: resting -> fluorescent -> resting */
    .express{opacity:.45;animation:express 10s ease-in-out infinite}
    .halo{opacity:.3;animation:halo 10s ease-in-out infinite}
    .gp{opacity:.6;animation:gp 10s ease-in-out infinite}
    .gp.d1{animation-delay:.5s}.gp.d2{animation-delay:1s}
    @keyframes express{0%,12%{opacity:.04}45%,68%{opacity:1}100%{opacity:.04}}
    @keyframes halo{0%,12%{opacity:0}45%,68%{opacity:.8}100%{opacity:0}}
    @keyframes gp{0%,18%{opacity:.08}50%,66%{opacity:1}100%{opacity:.08}}
    .drift{animation:drift 16s ease-in-out infinite}
    .drift2{animation:drift2 19s ease-in-out infinite}
    @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-3px)}}
    @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-3px,2px)}}
    .scan{opacity:.5;animation:scan 7s linear infinite}
    @keyframes scan{0%{transform:translateX(0)}100%{transform:translateX(380px)}}
    .blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
    .pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}

    /* Hover: full GFP fluorescence (works when the SVG is opened directly) */
    .hover-layer{opacity:0;transition:opacity .7s ease}
    #gfp-cell:hover .hover-layer{opacity:1}
    #gfp-cell{cursor:crosshair}

    @media (prefers-reduced-motion:reduce){
      .express,.halo,.gp,.drift,.drift2,.scan,.blink,.pulse{animation:none}
      .express{opacity:.45}.halo{opacity:.3}.gp{opacity:.6}.scan{opacity:0}
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E13"/><stop offset="1" stop-color="#0F161E"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131B24"/><stop offset="1" stop-color="#0E141B"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".045"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".015"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".15"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="cyto" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#1D2934" stop-opacity=".95"/><stop offset="1" stop-color="#111921" stop-opacity=".9"/>
    </radialGradient>
    <radialGradient id="gfp" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#7BE3A8" stop-opacity=".7"/>
      <stop offset=".6" stop-color="#4CC486" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2E8F63" stop-opacity=".22"/>
    </radialGradient>
    <radialGradient id="haloG" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5CD497" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#5CD497" stop-opacity=".12"/>
      <stop offset="1" stop-color="#5CD497" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FE8C0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9FE8C0" stop-opacity=".3"/>
      <stop offset="1" stop-color="#9FE8C0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" fill-opacity=".018"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cellClip"><rect x="102" y="220" width="300" height="130" rx="65"/></clipPath>
    <!-- GFP-like particles, split into three groups so they light up in a staggered way -->
    <g id="gfpA" class="gfill">
      <circle cx="140" cy="280" r="3"/><circle cx="198" cy="258" r="2.6"/><circle cx="262" cy="312" r="3.2"/>
      <circle cx="334" cy="310" r="2.6"/><circle cx="380" cy="298" r="2.4"/>
    </g>
    <g id="gfpB" class="gfill">
      <circle cx="172" cy="312" r="2.6"/><circle cx="248" cy="262" r="3"/><circle cx="310" cy="262" r="2.8"/>
      <circle cx="122" cy="296" r="2.2"/><circle cx="358" cy="252" r="2.4"/>
    </g>
    <g id="gfpC" class="gfill">
      <circle cx="226" cy="296" r="2.8"/><circle cx="286" cy="288" r="3.4"/><circle cx="356" cy="284" r="2.6"/>
      <circle cx="190" cy="286" r="2.2"/><circle cx="300" cy="322" r="2.4"/>
    </g>
  </defs>

  <!-- Frame -->
  <rect width="1180" height="610" rx="24" fill="url(#bg)"/>
  <rect width="1180" height="610" rx="24" fill="url(#scanlines)"/>
  <path d="M24 .5H1156A23.5 23.5 0 0 1 1179.5 24V56H.5V24A23.5 23.5 0 0 1 24 .5Z" fill="url(#header)"/>
  <line x1="1" y1="56.5" x2="1179" y2="56.5" class="frame" stroke-width="1"/>
  <rect x=".5" y=".5" width="1179" height="609" rx="23.5" fill="none" class="frame" stroke-width="1"/>

  <!-- Terminal header -->
  <circle cx="34" cy="28" r="6" class="w1" fill-opacity=".75"/>
  <circle cx="54" cy="28" r="6" class="w2" fill-opacity=".75"/>
  <circle cx="74" cy="28" r="6" class="w3" fill-opacity=".75"/>
  <text x="590" y="32.5" text-anchor="middle" font-size="13" class="m">hommam@biotech:~</text>
  <circle cx="1030" cy="28" r="3.5" class="g pulse"/>
  <text x="1042" y="32" font-size="12" class="g" letter-spacing=".06em">[ GFP: READY ]</text>

  <!-- LEFT: biological system -->
  <rect x="28.5" y="76.5" width="447" height="505" rx="16" fill="url(#glass)" stroke="url(#glassStroke)"/>
  <text x="52" y="106" class="c lbl">GFP.EXPRESSION</text>
  <text x="452" y="106" text-anchor="end" class="d lbl">E. coli · pGLO</text>
  <line x1="52" y1="120.5" x2="452" y2="120.5" class="ln"/>

  <!-- field-of-view ring -->
  <circle cx="252" cy="285" r="156" fill="none" class="ring" stroke-dasharray="2 6"/>
  <line x1="252" y1="124" x2="252" y2="134" class="ring"/><line x1="252" y1="436" x2="252" y2="446" class="ring"/>
  <line x1="91" y1="285" x2="101" y2="285" class="ring"/><line x1="403" y1="285" x2="413" y2="285" class="ring"/>

  <g id="gfp-cell" transform="rotate(-6 252 285)">
    <rect x="40" y="150" width="424" height="270" fill="#000" fill-opacity="0"/>

    <!-- fluorescence halo -->
    <ellipse cx="252" cy="285" rx="215" ry="135" fill="url(#haloG)" class="halo"/>
    <ellipse cx="252" cy="285" rx="225" ry="145" fill="url(#haloG)" class="hover-layer"/>

    <!-- flagella -->
    <path d="M106 306C88 326 76 312 62 330S48 350 40 346" fill="none" class="flag" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M390 334C404 356 420 346 430 364S446 382 458 378" fill="none" class="flag" stroke-width="1.2" stroke-linecap="round"/>

    <!-- outer membrane + cytoplasm -->
    <rect x="102" y="220" width="300" height="130" rx="65" fill="url(#cyto)" class="mem" stroke-width="1.5"/>

    <g clip-path="url(#cellClip)">
      <!-- GFP fluorescence (auto cycle) -->
      <rect x="102" y="220" width="300" height="130" fill="url(#gfp)" class="express"/>

      <!-- nucleoid: DNA double strand -->
      <ellipse cx="254" cy="285" rx="104" ry="34" fill="#9FB4C7" fill-opacity=".05"/>
      <path d="M165 285C180 268 195 268 210 285C225 302 240 302 255 285C270 268 285 268 300 285C315 302 330 302 345 285" fill="none" class="dna" stroke-width="1.3"/>
      <path d="M165 285C180 302 195 302 210 285C225 268 240 268 255 285C270 302 285 302 300 285C315 268 330 268 345 285" fill="none" class="dna" stroke-width="1.3"/>
      <g class="rung" stroke-width="1">
        <line x1="187" y1="274" x2="187" y2="296"/><line x1="232" y1="274" x2="232" y2="296"/>
        <line x1="277" y1="274" x2="277" y2="296"/><line x1="322" y1="274" x2="322" y2="296"/>
      </g>

      <!-- pGLO plasmids -->
      <circle cx="366" cy="262" r="9" fill="none" class="plas" stroke-width="1.2"/>
      <circle cx="140" cy="314" r="7" fill="none" class="plas" stroke-width="1.2"/>
      <g class="express">
        <circle cx="366" cy="262" r="9" fill="none" class="gstroke" stroke-width="1.4"/>
        <circle cx="140" cy="314" r="7" fill="none" class="gstroke" stroke-width="1.4"/>
      </g>

      <!-- ribosome-like particles -->
      <g class="rib drift">
        <circle cx="130" cy="262" r="1.7"/><circle cx="150" cy="298" r="1.6"/><circle cx="178" cy="248" r="1.8"/>
        <circle cx="214" cy="320" r="1.6"/><circle cx="236" cy="244" r="1.7"/><circle cx="268" cy="328" r="1.8"/>
        <circle cx="292" cy="244" r="1.6"/><circle cx="318" cy="320" r="1.7"/><circle cx="346" cy="300" r="1.6"/>
        <circle cx="384" cy="276" r="1.7"/><circle cx="160" cy="270" r="1.5"/><circle cx="330" cy="254" r="1.5"/>
      </g>

      <!-- GFP-like particles -->
      <g filter="url(#glow)" class="drift2">
        <use href="#gfpA" xlink:href="#gfpA" class="gp"/>
        <use href="#gfpB" xlink:href="#gfpB" class="gp d1"/>
        <use href="#gfpC" xlink:href="#gfpC" class="gp d2"/>
      </g>

      <!-- slow scan -->
      <rect x="62" y="215" width="36" height="140" fill="url(#scanG)" class="scan"/>

      <!-- hover: fully expressed -->
      <g class="hover-layer">
        <rect x="102" y="220" width="300" height="130" fill="url(#gfp)"/>
        <rect x="102" y="220" width="300" height="130" fill="url(#gfp)" opacity=".6"/>
        <g filter="url(#glow)">
          <use href="#gfpA" xlink:href="#gfpA"/><use href="#gfpB" xlink:href="#gfpB"/><use href="#gfpC" xlink:href="#gfpC"/>
        </g>
      </g>
    </g>

    <!-- inner membrane, highlight, fluorescent membrane -->
    <rect x="111" y="229" width="282" height="112" rx="56" fill="none" class="imem" stroke-width="1"/>
    <path d="M140 236C190 227 300 227 364 236" fill="none" class="spec" stroke-width="2" stroke-linecap="round"/>
    <rect x="102" y="220" width="300" height="130" rx="65" fill="none" class="gstroke express" stroke-width="1.8"/>
    <rect x="102" y="220" width="300" height="130" rx="65" fill="none" class="gstroke hover-layer" stroke-width="2.2" filter="url(#glow)"/>
  </g>

  <text x="252" y="470" text-anchor="middle" font-size="11" class="d" letter-spacing=".08em">ex 395 nm · em 509 nm</text>

  <!-- left identity -->
  <line x1="52" y1="488.5" x2="452" y2="488.5" class="ln"/>
  <circle cx="57" cy="510" r="3.5" class="g pulse"/>
  <text x="70" y="514" class="c lbl">BIO.SYSTEM // ONLINE</text>
  <text x="52" y="542" font-size="19" font-weight="600" class="t">Industrial Biotechnology</text>
  <text x="52" y="564" font-size="12.5" class="m">Biomanufacturing · Bioinformatics</text>

  <!-- RIGHT: system info -->
  <rect x="496.5" y="76.5" width="655" height="505" rx="16" fill="url(#glass)" stroke="url(#glassStroke)"/>
  <text x="524" y="106" class="c lbl">SYSTEM.INFO</text>
  <text x="1128" y="106" text-anchor="end" class="d lbl">mhommii</text>
  <line x1="524" y1="120.5" x2="1128" y2="120.5" class="ln"/>

  <text x="524" y="150" font-size="13"><tspan class="g">hommam@biotech</tspan><tspan class="m">:</tspan><tspan class="c">~</tspan><tspan class="m">$ </tspan><tspan class="t">./profile.sh</tspan></text>

  <g font-size="12" class="d" letter-spacing=".1em">
    <text x="524" y="192">› NAME</text>
    <text x="524" y="226">› ROLE</text>
    <text x="524" y="254">› STUDY</text>
    <text x="524" y="302">› FOCUS</text>
    <text x="524" y="356">› TOOLS</text>
    <text x="524" y="428">› LAB</text>
    <text x="524" y="458">› PROJECT</text>
  </g>

  <text x="636" y="192" font-size="22" font-weight="600" class="t">Mohammad Hommam Ijaz</text>
  <text x="636" y="226" font-size="15" class="t">Industrial Biotechnology Student</text>
  <text x="636" y="254" font-size="13.5" class="m">B.S. Biomanufacturing · Solano Community College</text>
  <line x1="524" y1="274.5" x2="1128" y2="274.5" class="ln" stroke-dasharray="2 4"/>
  <text x="636" y="302" font-size="14" class="t">Biomanufacturing <tspan class="g">·</tspan> Bioinformatics</text>
  <text x="636" y="324" font-size="14" class="t">Computational Biology <tspan class="g">·</tspan> AI for Biology</text>

  <g font-size="12" text-anchor="middle" class="c">
    <rect x="636.5" y="340.5" width="62" height="24" rx="6" class="pill"/><text x="667.5" y="356.5">BLAST</text>
    <rect x="706.5" y="340.5" width="86" height="24" rx="6" class="pill"/><text x="749.5" y="356.5">PROCHECK</text>
    <rect x="800.5" y="340.5" width="62" height="24" rx="6" class="pill"/><text x="831.5" y="356.5">ERRAT</text>
    <rect x="870.5" y="340.5" width="144" height="24" rx="6" class="pill"/><text x="942.5" y="356.5">Discovery Studio</text>
    <rect x="636.5" y="372.5" width="108" height="24" rx="6" class="pill"/><text x="690.5" y="388.5">UCSF Chimera</text>
    <rect x="752.5" y="372.5" width="116" height="24" rx="6" class="pill"/><text x="810.5" y="388.5">AutoDock Vina</text>
    <rect x="876.5" y="372.5" width="54" height="24" rx="6" class="pill"/><text x="903.5" y="388.5">PyRx</text>
    <rect x="938.5" y="372.5" width="62" height="24" rx="6" class="pill"/><text x="969.5" y="388.5">Python</text>
    <rect x="1008.5" y="372.5" width="30" height="24" rx="6" class="pill"/><text x="1023.5" y="388.5">R</text>
  </g>

  <text x="636" y="428" font-size="14" class="t">pGLO transformation <tspan class="g">·</tspan> GFP purification</text>
  <text x="636" y="458" font-size="12.5"><tspan class="t" font-weight="600">crispr-guide-design</tspan><tspan class="g"> · </tspan><tspan class="t" font-weight="600">cancer-crispr-targets</tspan><tspan class="g"> · </tspan><tspan class="m">VNIAS</tspan></text>

  <line x1="524" y1="488.5" x2="1128" y2="488.5" class="ln"/>
  <text x="524" y="522" font-size="13"><tspan class="g">hommam@biotech</tspan><tspan class="m">:</tspan><tspan class="c">~</tspan><tspan class="m">$ </tspan><tspan class="c blink">█</tspan></text>
  <text x="1128" y="522" text-anchor="end" font-size="12" class="d">github.com/mhommii</text>
  <text x="524" y="556" font-size="12" class="d"># biology first, computation as a tool</text>
</svg>
